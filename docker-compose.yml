# =====================================================================
# GEIS · GeoEnterprise Intelligence System — orquestación local
# ---------------------------------------------------------------------
# Servicios: db (PostGIS) · redis · api (FastAPI) · web (React + Nginx)
# Uso:  cp .env.example .env && docker compose up --build
# Todas las variables tienen default: `docker compose config` pasa
# limpio incluso sin .env.
# =====================================================================

services:
  db:
    # PG16: el n8n actual (≥1.108) rechaza Postgres 15; 16 queda en
    # modo compatibilidad y es la versión que ya usa Biokool Radar.
    image: postgis/postgis:16-3.5
    container_name: geis-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-geis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-geis_dev}
      - POSTGRES_DB=${POSTGRES_DB:-geis}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init.sql corre SOLO en la primera creación del volumen pgdata
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      # Nota: las variables se interpolan en TIEMPO DE CONFIG (compose),
      # así el healthcheck recibe valores ya resueltos (p. ej. -U geis).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geis} -d ${POSTGRES_DB:-geis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - geis-net

  redis:
    image: redis:7-alpine
    container_name: geis-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geis-net

  api:
    build: ./backend
    container_name: geis-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-geis}:${POSTGRES_PASSWORD:-geis_dev}@db:5432/${POSTGRES_DB:-geis}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-cambiar-en-produccion}
      - DENUE_API_TOKEN=${DENUE_API_TOKEN:-}
      # Módulo radar: orquestador n8n, scraper e integración LinkedIn.
      - N8N_URL=${N8N_URL:-http://n8n:5678}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - SCRAPER_URL=${SCRAPER_URL:-http://scraper:5000}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-}
      - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI:-}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Desarrollo: el código del backend se monta en vivo sobre /code,
      # así no hay que reconstruir la imagen en cada cambio.
      - ./backend:/code
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - geis-net

  web:
    build: ./frontend
    container_name: geis-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - geis-net

  # =====================================================================
  # Módulo de ejecución (fusión GEIS × Biokool Radar, blueprint §1.3/§8)
  # Servicios opcionales: se levantan con --profile automation / --profile tunnel
  # =====================================================================
  n8n:
    image: n8nio/n8n
    container_name: geis-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      # Clave de cifrado de credenciales (obligatoria para que sobrevivan
      # a recreaciones del contenedor; viene del .env).
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - TZ=America/Mexico_City
      # n8n guarda sus credenciales y ejecuciones en su propio Postgres
      # (el mismo PostGIS de GEIS; n8n crea sus tablas automáticamente).
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-geis}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-geis}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-geis_dev}
      # n8n restringe el acceso a archivos a ~/.n8n-files por defecto y usa
      # ';' como separador; el workflow 03-signal-catcher lee /signals/input.json.
      - N8N_RESTRICT_FILE_ACCESS_TO=/signals
    volumes:
      - n8n_data:/home/node/.n8n
      # Los workflows versionados viven en ./n8n/workflows (se importan
      # una vez desde la UI de n8n: Workflows → Import from file).
      - ./n8n/workflows:/home/node/workflows:ro
      # El workflow 03-signal-catcher lee /signals/input.json del SDR.
      - ./signals:/signals:ro
    depends_on:
      db:
        condition: service_healthy
    profiles: ["automation"]
    networks:
      - geis-net

  scraper:
    build: ./scraper
    container_name: geis-scraper
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-geis}:${POSTGRES_PASSWORD:-geis_dev}@db:5432/${POSTGRES_DB:-geis}
      - APIFY_TOKEN=${APIFY_TOKEN:-}
      - SCRAPER_PROVIDER=${SCRAPER_PROVIDER:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # python siempre existe en la imagen (CMD = python app.py); sin curl.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: ["automation"]
    networks:
      - geis-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: geis-cloudflared
    restart: unless-stopped
    # Túnel rápido hacia el frontend (puerto 80 interno del servicio web).
    command: tunnel --url http://web:80
    depends_on:
      - web
    profiles: ["tunnel"]
    networks:
      - geis-net

networks:
  geis-net:
    driver: bridge

volumes:
  pgdata:
  n8n_data:
