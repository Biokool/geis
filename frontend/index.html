    <title>GEIS · GeoEnterprise Intelligence System</title>
    <script>
      // Anti-FOUC: aplica el tema guardado antes de que React monte.
      try {
        var t = localStorage.getItem('geis-theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
