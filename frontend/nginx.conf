# =====================================================================
# GEIS · frontend/nginx.conf — sirve la SPA y proxya el API
# ---------------------------------------------------------------------
# Se copia a /etc/nginx/conf.d/default.conf en la etapa runtime del
# frontend/Dockerfile. El frontend llama al backend bajo el MISMO
# origen (rutas relativas /api/...), así no se necesita CORS en local.
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: conserva la ruta completa (/api/v1/...) hacia FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentación interactiva del API bajo el mismo origen
    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # SPA: cualquier otra ruta cae a index.html (routing del cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
